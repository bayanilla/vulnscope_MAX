<canvas id="stage" aria-label="Network graph of scanned hosts"></canvas>
<div id="vignette"></div>
<header id="hud">
  <div class="brand">MÚCARO <b>VULNSCOPE</b><span class="view">EXPLORER</span></div>
  <div id="subtitle" class="mono"></div>
</header>
<div id="controls">
  <button id="btn-overview" title="Back to the whole network (Esc)">Overview</button>
  <button id="btn-labels" aria-pressed="true" title="Show or hide labels (L)">Labels</button>
  <button id="btn-motion" aria-pressed="true" title="Animated traffic (M)">Motion</button>
  <button id="btn-ai" type="button" aria-controls="analyst-chat" aria-expanded="false" hidden>Security Assistant</button>
</div>
<aside id="rail">
  <input id="search" type="search" placeholder="Find host, IP, CVE  ( / )" aria-label="Find a host" autocomplete="off">
  <button id="ioc-filter" type="button" aria-pressed="false" hidden>IOC hosts <span id="ioc-host-count"></span></button>
  <div id="hostlist" role="list"></div>
</aside>
<aside id="panel" aria-live="polite" hidden></aside>
<section id="analyst-chat" class="analyst-chat ai-chat-overlay" data-ai-chat data-ask-url="ask"
  role="dialog" aria-modal="false" aria-labelledby="ai-chat-title" hidden>
  <div class="ai-chat-header"><h2 id="ai-chat-title">Security Assistant</h2>
    <button type="button" class="ai-chat-close" aria-label="Close Security Assistant">Close</button></div>
  <p class="ai-chat-status"></p><a class="ai-chat-settings" href="#">Change provider</a>
  <div class="ai-chat-log" role="log" aria-label="Security Assistant conversation" aria-live="polite"
    aria-relevant="additions" tabindex="0"></div>
  <form class="ai-chat-form"><label for="ai-question">Ask about these results</label>
    <textarea id="ai-question" rows="2" maxlength="4000" placeholder="Ask about a host, finding, or next step"></textarea>
    <div class="ai-chat-actions"><button type="submit" class="ai-chat-submit">Ask</button>
      <span class="ai-chat-busy" role="status"></span></div></form>
</section>
<div id="legend"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="hint">Click a host to see who is targeting it and how far a compromise could reach.</div>
<div id="intro"><div class="mono" id="intro-text"></div></div>
