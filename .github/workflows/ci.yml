# Runs on every pull request and every push to main. Five jobs run side by side:
#   hygiene       scripts/check_repo.py: no local branding, captures, executables, keys or files over 5 MB
#   tests         the unit test suite on Python 3.10 (oldest supported) and 3.13 (the Docker image's)
#   explorer      scripts/smoke/explorer_smoke.py: opens each sample's Explorer in headless Chromium, walks
#                 3D, focus, Flat, Attack paths and Timeline, fails on page errors or hosts/flows not drawn
#   docker-image  builds the Docker image and analyzes a bundled sample inside it
#   accuracy      runs the image on Brim's public sample captures and logs and compares every
#                 number with ground truth computed separately (scripts/accuracy/)
# Nothing here needs secrets, an API key or a model. The Brim files are downloaded on the CI
# machine, pinned to exact commits and SHA-256 checked; they are never committed or put in the image.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repo.py

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      VULNFLOW_LLM_PROVIDER: offline     # never reach for an AI provider
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests

  explorer:
    name: Explorer pages open and draw (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VULNFLOW_LLM_PROVIDER: offline
      VULNSCOPE_OFFLINE: "1"             # no article previews from the network
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Open every view of each sample's Explorer
        run: python scripts/smoke/explorer_smoke.py --samples smoke-work
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: smoke-work/smoke-shots/
          retention-days: 7

  docker-image:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: vulnscope-max:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Zeek and DuckDB are inside
        run: |
          docker run --rm vulnscope-max:ci zeek --version
          docker run --rm --entrypoint python3 vulnscope-max:ci -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Analyze the Gootloader sample in the container
        run: |
          mkdir -p runs
          docker run --rm -v "$PWD/runs:/runs" vulnscope-max:ci \
            analyze /opt/vulnscope/samples/gootloader_seo_poisoning -o /runs/demo
          test -s runs/demo/results.json
          test -s runs/demo/explorer.html
      - name: Upload page answers
        run: |
          docker run -d --name vs -p 127.0.0.1:8080:8080 vulnscope-max:ci
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 2; done
          docker logs vs; exit 1

  accuracy:
    name: Accuracy on Brim sample data
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: vulnscope-max:ci
          cache-from: type=gha
      - name: Cache the Brim files (verified again after restore)
        uses: actions/cache@v4
        with:
          path: brim-data
          key: brim-${{ hashFiles('scripts/accuracy/brim_manifest.txt') }}
      - name: Download, analyze and compare
        run: scripts/accuracy/run.sh brim-data accuracy-work
      - name: Keep the outputs when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-work/runs/*.log
            accuracy-work/runs/*/results.json
          retention-days: 7
